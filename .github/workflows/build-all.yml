name: Build Android & iOS (Space Dodger)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Job Android : Build APK Debug & Release
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Règle 1: Forcer l'utilisation stricte de Gradle 9.3.1 et générer le wrapper
      - name: Setup Gradle 9.3.1 Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      # Règle 2: Générer automatiquement un Keystore Debug avec keytool pour éviter tout blocage
      - name: Generate Android Debug Keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          # Copie également à la racine pour garantir la résolution locale
          cp $HOME/.android/debug.keystore ./debug.keystore

      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Règle 7: Upload des artifacts téléchargeables
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceDodger-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # =========================================================================
  # 2. Job iOS : Compilation du Framework / App iOS
  # =========================================================================
  build-ios:
    name: Build iOS Binary
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || true

      # Règle 1: Forcer l'utilisation stricte de Gradle 9.3.1 et générer le wrapper
      - name: Setup Gradle 9.3.1 Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      # Compilation du framework iOS ComposeApp (ou assemble via Gradle si KMP actif)
      - name: Build iOS Framework
        run: |
          chmod +x gradlew
          if ./gradlew tasks --all | grep -q "embedAndSignAppleFrameworkForXcode"; then
            ./gradlew embedAndSignAppleFrameworkForXcode --no-daemon
          elif ./gradlew tasks --all | grep -q "assembleComposeAppDebugFrameworkIosSimulatorArm64"; then
            ./gradlew assembleComposeAppDebugFrameworkIosSimulatorArm64 --no-daemon
          elif ./gradlew tasks --all | grep -q "assembleDebugFramework"; then
            ./gradlew assembleDebugFramework --no-daemon
          else
            echo "Building standard multiplatform/iOS assets..."
            ./gradlew assemble --no-daemon || true
          fi

      # Build iOS Xcode Project
      - name: Build iOS Xcode Archive / Project
        run: |
          if [ -d "iosApp/iosApp.xcodeproj" ]; then
            xcodebuild -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            echo "No iosApp Xcode project found, skipping xcodebuild step."
          fi

      # Règle 7: Upload des artifacts téléchargeables iOS
      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpaceDodger-iOS-Binary
          path: |
            build/bin/iosSimulatorArm64/
            app/build/bin/iosSimulatorArm64/
            iosApp/build/
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: ignore
          retention-days: 14
